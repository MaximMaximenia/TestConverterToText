<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="720" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#141414"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="60%">
      <stop offset="0" stop-color="#3a2e10" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4dd8a"/>
      <stop offset="0.5" stop-color="#d4af37"/>
      <stop offset="1" stop-color="#9c7a1f"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#glow)"/>

  <g opacity="0.5" stroke="#d4af37" stroke-width="1">
    <line x1="0" y1="60" x2="1280" y2="60"/>
    <line x1="0" y1="660" x2="1280" y2="660"/>
  </g>

  <text x="640" y="130" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="26" letter-spacing="6" fill="#d4af37">БЕСПЛАТНЫЙ ВЕБИНАР</text>

  <text x="640" y="300" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="58" fill="#f7f3ea" font-weight="600">Продавай так, чтобы</text>
  <text x="640" y="368" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="58" fill="url(#gold)" font-weight="600">у тебя покупали сами</text>

  <text x="640" y="420" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#c9c4b8">нажми и смотри разбор системы продаж за 12 минут</text>
</svg>
