<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Макс Миднайкс — клиенты через сайты</title>
<meta name="description" content="Превращаю сайты в источник клиентов. Разберу вашу рекламу и подскажу, какой сайт вам нужен.">
<style>
  :root{
    --green:#00C853;
    --green-dark:#00A344;
    --green-deep:#00792F;
    --green-tint:#EAF9EF;
    --graphite:#1A1A1A;
    --gray:#6E6E73;
    --hairline:rgba(0,0,0,.08);
  }
  *{margin:0; padding:0; box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", "Helvetica Neue", Arial, sans-serif;
    color:var(--graphite);
    background:#F5F7F6;
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 16px;
    position:relative;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }

  /* мягкие цветовые пятна фона, apple-стиль */
  body::before, body::after{
    content:'';
    position:fixed;
    border-radius:50%;
    filter:blur(90px);
    z-index:0;
    pointer-events:none;
  }
  body::before{
    width:560px; height:560px;
    top:-220px; left:-200px;
    background:radial-gradient(circle, rgba(0,200,83,.20), rgba(0,200,83,.02) 65%, transparent 75%);
  }
  body::after{
    width:520px; height:520px;
    bottom:-220px; right:-200px;
    background:radial-gradient(circle, rgba(0,121,47,.14), rgba(0,121,47,.02) 65%, transparent 75%);
  }

  .card{
    position:relative;
    z-index:1;
    width:100%;
    max-width:400px;
    background:rgba(255,255,255,.86);
    -webkit-backdrop-filter:blur(24px) saturate(180%);
    backdrop-filter:blur(24px) saturate(180%);
    border:1px solid rgba(255,255,255,.6);
    border-radius:28px;
    padding:40px 30px 30px;
    box-shadow:0 20px 60px -16px rgba(0,20,10,.16), 0 1px 2px rgba(0,0,0,.03);
    text-align:center;
    animation:cardIn .6s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes cardIn{from{opacity:0; transform:translateY(12px);} to{opacity:1; transform:translateY(0);}}

  .avatar{
    width:104px; height:104px;
    margin:0 auto 18px;
    border-radius:50%;
    overflow:hidden;
    border:1px solid var(--hairline);
    box-shadow:0 8px 20px -8px rgba(0,0,0,.18);
  }
  .avatar img{width:100%; height:100%; object-fit:cover; display:block;}

  .name-row{display:flex; align-items:center; justify-content:center; gap:6px; margin-bottom:3px;}
  h1{
    font-weight:700;
    font-size:22px;
    letter-spacing:-0.015em;
  }
  .badge{
    width:16px; height:16px;
    border-radius:50%;
    background:var(--green);
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .badge svg{width:9px; height:9px;}

  .role{
    font-size:14.5px;
    color:var(--gray);
    margin-bottom:24px;
    letter-spacing:-0.005em;
  }

  .bio{
    list-style:none;
    display:flex;
    flex-direction:column;
    margin-bottom:26px;
    text-align:left;
    border-top:1px solid var(--hairline);
  }
  .bio li{
    font-size:14px;
    line-height:1.4;
    color:var(--graphite);
    display:flex;
    gap:12px;
    align-items:center;
    padding:13px 2px;
    border-bottom:1px solid var(--hairline);
    letter-spacing:-0.005em;
  }
  .bio li .ico{
    width:26px; height:26px;
    border-radius:8px;
    background:var(--green-tint);
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .bio li .ico svg{width:14px; height:14px;}
  .bio li b{font-weight:600;}

  .proof{margin-bottom:24px; text-align:left;}
  .proof-label{
    font-size:11px;
    font-weight:600;
    letter-spacing:.04em;
    text-transform:uppercase;
    color:var(--green-deep);
    margin-bottom:6px;
    display:block;
  }
  .proof-caption{
    font-size:14px;
    font-weight:600;
    color:var(--graphite);
    margin-bottom:12px;
    line-height:1.35;
    letter-spacing:-0.005em;
  }
  .proof-shot{
    width:100%;
    border-radius:14px;
    border:1px solid var(--hairline);
    display:block;
    box-shadow:0 10px 24px -12px rgba(0,0,0,.14);
  }

  .cta{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:9px;
    width:100%;
    font-family:inherit;
    font-weight:600;
    font-size:16px;
    letter-spacing:-0.01em;
    color:#fff;
    background:var(--green-dark);
    padding:15px 24px;
    border-radius:14px;
    text-decoration:none;
    box-shadow:0 8px 20px -6px rgba(0,163,68,.45);
    transition:transform .2s cubic-bezier(.2,.8,.2,1), box-shadow .2s ease, background .2s ease;
  }
  .cta:hover{background:var(--green-deep); transform:translateY(-1px); box-shadow:0 10px 24px -6px rgba(0,163,68,.55);}
  .cta:active{transform:translateY(0);}
  .cta svg{width:18px; height:18px; flex-shrink:0;}

  @media (max-width:420px){
    .card{padding:34px 22px 24px; border-radius:24px;}
    h1{font-size:20px;}
  }
</style>
</head>
<body>

<div class="card">

  <div class="avatar">
    <img src="images/max-photo.jpg" alt="Макс Миднайкс">
  </div>

  <div class="name-row">
    <h1>Макс Миднайкс</h1>
    <span class="badge">
      <svg viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </span>
  </div>
  <div class="role">Клиенты через сайты</div>

  <ul class="bio">
    <li>
      <span class="ico"><svg viewBox="0 0 24 24" fill="none"><path d="M3 7l6 6 4-4 8 8M15 17h6v-6" stroke="var(--green-deep)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <span>Реклама запущена, а заявок почти нет?</span>
    </li>
    <li>
      <span class="ico"><svg viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="14" rx="2" stroke="var(--green-deep)" stroke-width="1.8"/><path d="M3 9h18" stroke="var(--green-deep)" stroke-width="1.8"/></svg></span>
      <span>Сайт есть, но с него не приходят клиенты?</span>
    </li>
    <li>
      <span class="ico"><svg viewBox="0 0 24 24" fill="none"><circle cx="10.5" cy="10.5" r="6.5" stroke="var(--green-deep)" stroke-width="1.8"/><path d="M20 20l-4.5-4.5" stroke="var(--green-deep)" stroke-width="1.8" stroke-linecap="round"/></svg></span>
      <span>Разберу вашу ситуацию и покажу, где вы теряете клиентов</span>
    </li>
  </ul>

  <div class="proof">
    <span class="proof-label">Один из моих рекламных кабинетов</span>
    <div class="proof-caption">Ниша — кондиционеры: привели 121 лид, сделали 40+ продаж</div>
    <img class="proof-shot" src="images/ads-proof.jpg" alt="Результаты рекламного кабинета: ниша кондиционеры, 121 конверсия">
  </div>

  <a class="cta" id="ctaBtn" href="https://t.me/midnaix?text=%D0%9F%D1%80%D0%B8%D0%B2%D0%B5%D1%82%21%20%D0%9F%D0%B8%D1%88%D1%83%20%D1%81%20%D0%B2%D0%B0%D1%88%D0%B5%D0%B9%20%D0%B2%D0%B8%D0%B7%D0%B8%D1%82%D0%BA%D0%B8%20%E2%80%94%20%D1%85%D0%BE%D1%87%D1%83%20%D1%80%D0%B0%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D1%82%D1%8C%20%D1%80%D0%B5%D0%BA%D0%BB%D0%B0%D0%BC%D1%83%20%D0%B8%20%D1%81%D0%B0%D0%B9%D1%82." target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24" fill="#fff"><path d="M21.5 4.5L2.7 11.9c-1.1.4-1.1 1.9.1 2.3l4.6 1.5 1.8 5.5c.3.9 1.4 1.1 2.1.4l2.6-2.5 4.9 3.6c.9.6 2.1.1 2.3-1L23.9 5.7c.2-1.1-.9-1.9-1.9-1.5zM8.5 15.1l9.5-6.9c.3-.2.6.2.3.4l-8 8-.3 3.4-1.5-4.9z"/></svg>
    Написать в Telegram
  </a>

</div>

<script>
  const TELEGRAM_BOT_TOKEN = "7724314363:AAG5OuDDLOTpz7DT0UjXPvWGkqdKENkGMiw";
  const TELEGRAM_CHAT_ID = "636168342";
  document.getElementById('ctaBtn').addEventListener('click', () => {
    const message = `👋 Клик "Написать в Telegram" на визитке (card.html)\nВремя: ${new Date().toLocaleString('ru-RU')}\nОткуда: ${document.referrer || 'прямой заход'}`;
    fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage?chat_id=${TELEGRAM_CHAT_ID}&text=${encodeURIComponent(message)}`).catch(() => {});
  });
</script>

</body>
</html>
